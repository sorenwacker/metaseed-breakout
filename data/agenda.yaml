- start: 0
  end: 5
  title: Opening
  format: Poll or show of hands
  body: One slide with the cycle. Question to the room - where does metadata get lost in your work?
- start: 5
  end: 15
  title: Live demo of one full cycle
  format: Presenter, with a recorded video as backup
  body: Create a MIAPPE 1.2 dataset, fill in two entities, fix a validation error, share it, export ISA-JSON. Clone the profile, add a field, publish v1.1. The existing dataset stays pinned to v1.0.
- start: 15
  end: 35
  title: Hands-on tracks
  format: Groups of 2-3
  body: Participants choose one of four tracks - researcher, data steward, developer, or the no-laptop poster track.
  link: /tracks
- start: 35
  end: 46
  title: Discussion on sustainability
  format: Whole room, notes on a shared board
  body: Three or four questions about who maintains a standard, what counts as a breaking change, and where the hub fits.
  link: /discussion
- start: 46
  end: 50
  title: Wrap-up
  format: Presenter
  body: Read back the friction points. Collect names for a pilot. QR codes for the hub and the documentation.

- start: 0
  end: 7
  title: Opening and introduction
  format: Presenter, with a show of hands
  body: The introductory part of the presentation, up to the lessons learned - what metadata and specifications are, why specifications are hard to compare, and what metaseed does. Question to the room - which metadata standards do you work with, and which would you like to have implemented?
  link: /presentation
- start: 7
  end: 15
  title: Live demo of one full cycle
  format: Presenter, with a recorded video as backup
  body: Create a MIAPPE 1.2 dataset, fill in two entities, fix a validation error, share it, export it to Excel and open its DCAT record. Clone the profile, add a field and publish the result as a new specification. The existing dataset stays bound to MIAPPE 1.2.
- start: 15
  end: 35
  title: Hands-on tracks
  format: Groups of 2-3
  body: Participants choose one of four tracks - researcher, data steward, developer, or the no-laptop poster track.
  link: /tracks
- start: 35
  end: 46
  title: Lessons learned and discussion
  format: Presenter, then whole room with notes on a shared board
  body: Six lessons from the fellowship in three minutes. Then three or four questions about who maintains a standard, what counts as a breaking change, and where the hub fits.
  link: /discussion
- start: 46
  end: 50
  title: Wrap-up
  format: Presenter
  body: Read back the friction points. Collect names for a pilot. QR codes for the hub and the documentation.

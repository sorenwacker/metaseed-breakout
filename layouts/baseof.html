<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="{{ "/" | relURL }}">
        <img class="logo" src="{{ "images/metaseed-icon.svg" | relURL }}" alt="">
        <span>Metaseed Hub breakout</span>
      </a>
      <nav aria-label="Main">
        {{ $current := . }}
        {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (eq $current.RelPermalink .URL) }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
      {{ partial "theme-toggle.html" . }}
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>{{ site.Params.event }} &middot; {{ site.Params.duration }}</span>
      <span><a href="{{ site.Params.hub_url }}">Live hub</a> &middot; <a href="{{ site.Params.docs_url }}">Documentation</a></span>
    </div>
  </footer>
</body>
</html>

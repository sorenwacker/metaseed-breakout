<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} - {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.event }}{{ end }}">
  <link rel="icon" href="{{ "images/metaseed-icon.svg" | relURL }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  {{ with resources.Get "css/main.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ .RelPermalink }}">{{ end }}
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="{{ "/" | relURL }}">
        <img class="logo" src="{{ "images/metaseed-icon.svg" | relURL }}" alt="">
        <span>Metaseed Hub breakout</span>
      </a>
      <nav aria-label="Main">
        {{ $current := . }}
        {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (eq $current.RelPermalink .URL) }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>{{ site.Params.event }} &middot; {{ site.Params.duration }}</span>
      <span><a href="{{ site.Params.hub_url }}">Live hub</a> &middot; <a href="{{ site.Params.docs_url }}">Documentation</a></span>
    </div>
  </footer>
</body>
</html>

{{- $src := .Get "src" -}}
{{- $img := resources.Get $src -}}
{{- if not $img }}{{ errorf "screenshot %q not found in assets (%s)" $src .Position }}{{ end -}}
<figure class="shot">
  <img src="{{ ($img | fingerprint).RelPermalink }}" width="{{ $img.Width }}" height="{{ $img.Height }}" alt="{{ .Get "alt" }}" loading="lazy">
  {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>

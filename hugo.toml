baseURL = "/"
locale = "en"
title = "Metaseed Hub breakout"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[params]
event = "FAIR in Action: Building a Sustainable FAIR Future in Life Science and Health"
duration = "50 min"
hub_url = "https://metaseed.ewi.tudelft.nl"
docs_url = "https://sorenwacker.github.io/metaseed-hub/"

[menus]
  [[menus.main]]
    name = "Session"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Agenda"
    pageRef = "/agenda"
    weight = 12
  [[menus.main]]
    name = "Presentation"
    pageRef = "/presentation"
    weight = 15
  [[menus.main]]
    name = "Cycle"
    pageRef = "/cycle"
    weight = 20
  [[menus.main]]
    name = "Tracks"
    pageRef = "/tracks"
    weight = 40
  [[menus.main]]
    name = "Discussion"
    pageRef = "/discussion"
    weight = 50
  [[menus.main]]
    name = "Preparation"
    pageRef = "/preparation"
    weight = 60

[outputFormats.slides]
baseName = "slides"
mediaType = "text/html"
isHTML = true

[markup.goldmark.renderer]
unsafe = true
